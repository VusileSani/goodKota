<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F15A29" />
  <meta name="description" content="Yagoya — trusted local food discovery, quality-led recommendations, ordering, pickup and delivery." />
  <title>Yagoya</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/yagoya-logo.png" type="image/png" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="brandSplash" class="brand-splash" aria-hidden="true">
    <img class="brand-splash-logo" src="./assets/yagoya-logo.png" alt="" />
  </div>

  <header class="app-header">
    <div class="header-brand-zone">
      <button class="brand" id="brandHome" aria-label="Yagoya home">
        <span class="brand-logo-shell"><img class="brand-logo" src="./assets/yagoya-logo.png" alt="" /></span>
        <span class="brand-wordmark"><strong>Yagoya</strong><small>Good food. Nearby.</small></span>
      </button>
    </div>

    <div class="header-actions">
      <nav class="brand-links" id="brandLinks" aria-label="Yagoya brand links">
        <a class="brand-link explore-link" href="./website.html">Explore Yagoya</a>
      </nav>

      <div id="authControls" class="auth-controls" aria-live="polite">
        <button type="button" class="auth-button" id="authButton">Sign in</button>
      </div>

      <label class="actor-switcher">
        <span>Preview as</span>
        <select id="roleSelect" aria-label="Switch Yagoya actor">
          <option value="customer">Customer</option>
          <option value="merchant">Merchant</option>
          <option value="driver">Driver</option>
          <option value="delivery">Delivery Ops</option>
          <option value="admin">Yagoya Admin</option>
          <option value="owner">Yagoya Owner</option>
        </select>
      </label>
    </div>
  </header>
  <div id="actorContext" class="actor-context" aria-live="polite"></div>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <dialog id="appDialog" class="dialog"></dialog>

  <footer class="app-footer">
    <strong>Yagoya</strong>
    <span>We tell you where the good food is.</span>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
