<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="GoodKota — location-first kota discovery, verified quality, ordering and delivery-ready fulfilment." />
  <title>GoodKota — Foundation v3 Delivery Ready</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="app-header">
    <button class="brand" id="brandHome" aria-label="GoodKota home">
      <span class="brand-mark">GK</span>
      <span>GoodKota</span>
    </button>

    <nav class="role-tabs" aria-label="Prototype views">
      <button data-route="customer" class="active">Customer</button>
      <button data-route="merchant">Merchant</button>
      <button data-route="driver">Driver</button>
      <button data-route="delivery">Delivery Ops</button>
      <button data-route="admin">GoodKota Office</button>
    </nav>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <dialog id="appDialog" class="dialog"></dialog>

  <footer class="app-footer">
    <strong>GoodKota Foundation v3 — Delivery Ready</strong>
    <span>Location-first discovery · Verified quality · Direct merchant settlement · Driver/dispatch-ready fulfilment</span>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
