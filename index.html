<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f15a29" />
  <meta name="description" content="GoodKota — the trusted guide to good kota near you." />
  <title>GoodKota — Good kota near you</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/goodkota-logo.png" type="image/png" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="app-frame">
    <header class="topbar">
      <button class="brand" id="brandHome" aria-label="Go to GoodKota home">
        <img src="./assets/goodkota-logo.png" alt="" />
        <span>GoodKota</span>
      </button>
      <div class="topbar-actions">
        <div class="location-pill" aria-label="Current area">
          <span class="location-dot"></span>
          <span id="locationLabel">Midrand</span>
        </div>
        <label class="workspace-select">
          <span>Workspace</span>
          <select id="roleSelect" aria-label="Choose workspace">
            <option value="customer">Customer</option>
            <option value="merchant">Merchant</option>
            <option value="admin">GoodKota</option>
          </select>
        </label>
      </div>
    </header>

    <main id="app" class="app"></main>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
