<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F15A29" />
  <meta name="description" content="GoodKota — location-first kota discovery, verified quality, ordering and delivery-ready fulfilment." />
  <title>GoodKota — Foundation v4.3</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/goodkota-logo.png" type="image/png" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="brandSplash" class="brand-splash" aria-hidden="true">
    <img class="brand-splash-logo" src="./assets/goodkota-logo.png" alt="" />
  </div>

  <header class="app-header">
    <button class="brand" id="brandHome" aria-label="GoodKota home">
      <img class="brand-logo" src="./assets/goodkota-logo.png" alt="" />
      <span>GoodKota</span>
    </button>

    <nav class="role-tabs" aria-label="Prototype views">
      <button data-route="customer" class="active">Customer</button>
      <button data-route="merchant">Merchant</button>
      <button data-route="driver">Driver</button>
      <button data-route="delivery">Delivery Ops</button>
      <button data-route="admin">GoodKota Office</button>
    </nav>

    <select id="mobileRoleSelect" class="mobile-role-select" aria-label="Prototype view">
      <option value="customer">Customer</option>
      <option value="merchant">Merchant</option>
      <option value="driver">Driver</option>
      <option value="delivery">Delivery Ops</option>
      <option value="admin">GoodKota Office</option>
    </select>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <dialog id="appDialog" class="dialog"></dialog>

  <footer class="app-footer">
    <strong>GoodKota</strong>
    <span>Find it nearby. Order it. Enjoy it.</span>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
